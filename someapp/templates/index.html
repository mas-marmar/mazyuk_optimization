<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Товары и производители</title>
</head>
<body>
    <h1>Товары</h1>
    <ul>
        {% for product in products %}
            <li>
                {{ product.name }} - {{ product.price }} ₽
            </li>
        {% endfor %}
    </ul>

    <h1>Производители</h1>
    <ul>
        {% for m in manufacturers %}
            <li>{{ m.name }} - {{ m.country }}</li>
        {% endfor %}
    </ul>
</body>
</html>
